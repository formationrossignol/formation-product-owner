id: case-education
title: "Learnify — Stopper la chute de rétention J30"
difficulty: junior
estimated_duration: 100

context:
  company: Learnify
  industry: EdTech B2C — Plateforme d'apprentissage en ligne
  role: Product Owner
  logo: "🎓"
  summary: >
    Learnify est une plateforme d'apprentissage en ligne pour lycéens et étudiants avec
    450 000 utilisateurs inscrits. La rétention J30 est tombée de 45% à 21% en 4 mois.
    Les utilisateurs s'inscrivent mais n'apprennent pas. La direction donne 90 jours pour
    inverser la tendance ou réduire les équipes. C'est votre mission.
  business_goal: "Ramener la rétention J30 au-dessus de 35% dans les 90 jours"
  constraints:
    - "Équipe de 3 développeurs et 1 designer (budget contraint)"
    - "Les utilisateurs gratuits représentent 85% des inscrits"
    - "Les parents paient pour les abonnements premium (clients payants ≠ utilisateurs)"
    - "La concurrence (Khan Academy, Duolingo, Brainly) est gratuite et bien financée"

personas:
  - id: lucas
    name: "Lucas Dupré"
    role: Lycéen, 16 ans
    avatar: "🧑‍🎓"
    personality: "Distrait, smartphone addictif, motive par les défis et les récompenses"
    goals: "Améliorer ses notes sans passer des heures à travailler"
    pain_points: "Les cours sur Learnify sont longs et ennuyeux, TikTok est plus fun"
    communication_style: "Court, visuel, récompenses immédiates"
    quote: "J'ai essayé Learnify mais les vidéos durent 20 minutes. J'ai pas la patience."

  - id: emma_etud
    name: "Emma Roussel"
    role: Étudiante en BTS, 19 ans
    avatar: "👩‍🎓"
    personality: "Studieuse mais débordée, cherche l'efficacité maximale"
    goals: "Réviser efficacement avant les examens, pas perdre de temps"
    pain_points: "Difficile de savoir où en est dans son apprentissage"
    communication_style: "Structurée, apprécie les indicateurs de progression"
    quote: "Je me connecte, je fais un exercice, et après je sais pas si j'ai bien appris ou pas."

  - id: parent_marie
    name: "Marie Lambert"
    role: Parent, abonnement premium pour son fils
    avatar: "👩"
    personality: "Inquiète des résultats scolaires, cliente payante, attend un retour sur investissement"
    goals: "Voir son fils progresser et utiliser réellement la plateforme"
    pain_points: "Paye 9€/mois et son fils ne se connecte jamais"
    communication_style: "Formelle avec le support, compare aux apps concurrentes"
    quote: "Je paye 9€ par mois. Mon fils s'est connecté 2 fois ce mois. Je vais résilier si ça ne change pas."

  - id: prof_jean
    name: "Jean Moreau"
    role: Enseignant partenaire
    avatar: "👨‍🏫"
    personality: "Pédagogue, méfiant vis-à-vis de l'EdTech, attaché à la qualité du contenu"
    goals: "Que ses élèves utilisent Learnify pour progresser réellement, pas juste pour s'amuser"
    pain_points: "Les élèves cliquent vite sans lire, le score gamifié ne reflète pas l'apprentissage réel"
    communication_style: "Formelle, exigeante sur la pédagogie"
    quote: "Mes élèves ont tous Learnify mais personne n'apprend vraiment. Ils cherchent juste les badges."

