datasets:
  interviews:
    - persona_id: lucas
      excerpt: >
        "Learnify c'est cool au début. J'ai commencé un cours sur les maths,
        c'était pas mal. Mais après j'ai eu des notifs de TikTok et j'ai oublié.
        Les cours sont trop longs, je m'ennuie après 5 minutes.
        Duolingo c'est bien parce que les leçons durent 3 minutes max.
        Si Learnify faisait pareil je reviendrais peut-être. Et si j'avais des streaks
        comme sur Snapchat, j'essaierai de pas les perdre."

    - persona_id: emma_etud
      excerpt: >
        "Ce qui me manque c'est de savoir si j'ai bien compris.
        Je fais un exercice, j'ai 7/10, mais je sais pas si c'est bien ou pas
        et je sais pas ce que j'ai raté exactement.
        Sur Kahn Academy j'avais un graphique qui me montrait mes progrès.
        Ici j'ai juste un nombre de points qui monte mais ça veut rien dire pour moi."

    - persona_id: parent_marie
      excerpt: >
        "Mon fils m'a dit qu'il utilise Learnify mais quand je regarde son téléphone
        c'est surtout YouTube et Discord. Je reçois un rapport hebdomadaire mais
        il dit juste 'Lucas a gagné 150 XP cette semaine' — ça ne me dit pas
        s'il a progressé en maths ou en anglais.
        Si j'avais un vrai rapport de progression par matière, je saurais si ça vaut la peine."

