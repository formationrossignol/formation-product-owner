id: case-saas-b2b
title: "OpsFlow — Dette technique vs croissance"
difficulty: advanced
estimated_duration: 150

context:
  company: OpsFlow
  industry: SaaS B2B — Gestion de projets pour PME
  role: Product Owner
  logo: "⚙️"
  summary: >
    OpsFlow est un SaaS de gestion de projets utilisé par 1 200 PME en France.
    La plateforme accumule depuis 3 ans une dette technique critique qui ralentit
    chaque livraison. Pendant ce temps, 4 clients stratégiques menacent de ne pas
    renouveler leur contrat si de nouvelles fonctionnalités ne sont pas livrées avant Q3.
    Vous devez arbitrer entre rembourser la dette technique et satisfaire les clients.
  business_goal: "Maintenir un NRR > 110% tout en réduisant le lead time de livraison de 40% d'ici fin d'année"
  constraints:
    - "Budget tech gelé : pas de recrutement possible avant Q4"
    - "4 clients représentant 35% du MRR menacent de churner"
    - "L'équipe dev estime la dette technique à 6 mois-homme"
    - "Investisseurs attendent une démo de la nouvelle version en Q3"

personas:
  - id: thomas
    name: Thomas Renard
    role: CTO
    avatar: "👨‍💻"
    personality: "Pragmatique, orienté qualité, frustré par les compromis constants"
    goals: "Rembourser la dette technique avant que ça explose en production"
    pain_points: "Les features demandées par les clients ralentissent le cleanup"
    communication_style: "Direct, chiffres à l'appui, peu de patience pour le flou"
    quote: "Chaque feature livrée sur du code legacy nous coûte 3x plus cher la prochaine fois."

  - id: camille
    name: Camille Moreau
    role: Customer Success Manager
    avatar: "👩‍💼"
    personality: "Empathique, proche des clients, inquiète pour les renouvellements"
    goals: "Sécuriser les 4 renouvellements critiques d'ici Q3"
    pain_points: "Les promesses faites aux clients ne sont pas tenues par l'équipe prod"
    communication_style: "Relationnel, urgences fréquentes, escalade rapide"
    quote: "Textilpro m'a appelée hier. Ils vont partir chez Asana si on n'a pas les sous-tâches en juin."

  - id: jerome
    name: Jérôme Fabre
    role: CEO
    avatar: "🧑‍💼"
    personality: "Vision long terme, sous pression des investisseurs"
    goals: "Démontrer la traction produit pour la levée de fonds Serie A"
    pain_points: "Tension entre roadmap investisseurs et besoins clients immédiats"
    communication_style: "Stratégique, préfère les KPIs aux détails techniques"
    quote: "Les investisseurs veulent voir l'IA intégrée dans la démo Q3. C'est non-négociable."

  - id: lea
    name: Léa Dupont
    role: Lead Developer
    avatar: "👩‍🔧"
    personality: "Perfectionniste, burn-out latent, défend l'équipe"
    goals: "Refactoriser le module core avant d'ajouter quoi que ce soit"
    pain_points: "Les estimations explosent à cause du code legacy"
    communication_style: "Technique, prudente sur les engagements, apprécie la transparence"
    quote: "On ne peut plus estimer correctement. Le module tasks est un château de cartes."

kpis:
  - id: nrr
    label: "NRR (Net Revenue Retention)"
    value: 104
    unit: "%"
    target: 110
    trend: down
    description: "Expansion + renouvellements / ARR de départ"

  - id: lead_time
    label: "Lead Time moyen"
    value: 24
    unit: "jours"
    target: 14
    trend: up
    description: "Temps entre story ready et déploiement production"

  - id: churn_risk
    label: "Clients à risque de churn"
    value: 4
    unit: "comptes"
    target: 0
    trend: up
    description: "Comptes avec probabilité de départ > 70%"

  - id: tech_debt_score
    label: "Score dette technique"
    value: 67
    unit: "/100"
    target: 30
    trend: up
    description: "Score calculé par SonarQube (100 = critique)"

  - id: csat
    label: "CSAT"
    value: 62
    unit: "%"
    target: 80
    trend: down
    description: "Satisfaction client mesurée post-support"

datasets:
  interviews:
    - persona_id: thomas
      excerpt: >
        "Le module 'tasks' a été écrit en 2021 par un dev qui est parti.
        Il n'y a aucun test, les méthodes font 400 lignes, et chaque fois qu'on touche quelque chose
        on casse trois autres trucs. La semaine dernière on a mis 3 jours à livrer un bug fix
        qui aurait dû prendre 2 heures. Sans refacto, on ne peut pas accélérer."

    - persona_id: camille
      excerpt: >
        "Textilpro, BatiPlus, LogiCorp et MédiaGroup — ce sont nos 4 plus gros comptes.
        Ensemble ils représentent 420K€ d'ARR. Ils ont tous la même demande :
        les sous-tâches imbriquées et les rapports d'avancement automatiques.
        Ça fait 18 mois qu'on leur promet ça. Si c'est pas dispo en juin, ils partent."

    - persona_id: lea
      excerpt: >
        "J'ai fait l'audit la semaine dernière. Pour livrer les sous-tâches correctement
        il faut d'abord refactoriser le modèle de données tasks — sinon on crée 6 mois de dette
        en plus. Le bon chemin c'est : refacto data model (3 semaines), puis sous-tâches (4 semaines).
        Le mauvais chemin c'est : sous-tâches en 2 semaines sur du code pourri,
        et on passe les 6 prochains mois à gérer les incidents."

  analytics:
    - title: "Évolution du Lead Time (12 derniers mois)"
      type: line
      data:
