id: case-sante
title: "MediLink — Coordination soignants sous contraintes réglementaires"
difficulty: advanced
estimated_duration: 150

context:
  company: MediLink
  industry: Santé numérique — Coordination des soins
  role: Product Owner
  logo: "🏥"
  summary: >
    MediLink est une plateforme de coordination entre médecins, infirmiers libéraux
    et établissements de santé, certifiée HDS (Hébergeur de Données de Santé).
    Après un audit RGPD, la CNIL impose des corrections sous 90 jours sous peine d'amende.
    En parallèle, les médecins demandent une application mobile et les hôpitaux veulent
    une intégration avec leurs systèmes d'information (DPI). Vous devez tout arbitrer.
  business_goal: "Obtenir la mise en conformité CNIL dans les délais ET lancer la version mobile avant la rentrée médicale de septembre"
  constraints:
    - "Mise en conformité CNIL obligatoire sous 90 jours (pénalité jusqu'à 4% CA)"
    - "Certification HDS doit être maintenue en permanence"
    - "Toute donnée de santé doit rester sur des serveurs en France (souveraineté)"
    - "Les médecins ne peuvent pas être perturbés pendant les consultations"

personas:
  - id: dr_martin
    name: "Dr. Sophie Martin"
    role: Médecin généraliste
    avatar: "👩‍⚕️"
    personality: "Pragmatique, peu de temps, exigeante sur la fiabilité"
    goals: "Coordonner les soins de ses patients chroniques sans perte de temps"
    pain_points: "Trop d'étapes pour partager un compte-rendu avec un infirmier"
    communication_style: "Direct, veut des solutions simples, réfractaire aux formations longues"
    quote: "Je ne peux pas perdre 3 minutes entre deux consultations à chercher comment partager un document."

  - id: infirmier_pierre
    name: "Pierre Lefort"
    role: Infirmier libéral
    avatar: "👨‍⚕️"
    personality: "Mobile, terrain, utilise son smartphone toute la journée"
    goals: "Accéder aux prescriptions et ordonnances directement sur le terrain"
    pain_points: "Impossible de consulter MediLink sur mobile, interface non responsive"
    communication_style: "Informel, feedback direct, utilisateur quotidien"
    quote: "Je suis en déplacement toute la journée. L'application web ne fonctionne pas sur mon téléphone."

  - id: dsi_hopital
    name: "Marc Leblanc"
    role: DSI Hôpital Saint-Louis"
    avatar: "🧑‍💼"
    personality: "Technique, processus rigoureux, exigeant sur la sécurité"
    goals: "Intégrer MediLink au DPI hospitalier pour éviter la double saisie"
    pain_points: "Absence d'API standardisée pour connecter MediLink à leur système HL7"
    communication_style: "Technique, spécifications formelles, délais longs de validation"
    quote: "Nos médecins saisissent les mêmes informations deux fois. Il faut une API HL7 FHIR."

  - id: dpo
    name: "Isabelle Roux"
    role: Délégué·e à la Protection des Données (DPO)"
    avatar: "⚖️"
    personality: "Rigoureuse, juriste, ne négocie pas sur la conformité"
    goals: "Obtenir la conformité CNIL dans les délais légaux"
    pain_points: "Les développeurs minimisent les risques réglementaires"
    communication_style: "Formelle, écrit beaucoup, chaque engagement est documenté"
    quote: "On a 90 jours. Chaque jour de retard est un risque pénal pour la direction."

kpis:
