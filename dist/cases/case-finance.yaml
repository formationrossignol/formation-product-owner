datasets:
  interviews:
    - persona_id: emma
      excerpt: >
        "À l'étape où on me demande mon IBAN, j'ai dû chercher mon RIB dans mes mails pendant 10 minutes.
        Et après ça m'a dit que mon document d'identité n'était pas lisible et j'ai dû recommencer.
        J'avais commencé le processus dans le métro, j'ai abandonné à la sortie.
        Une amie m'a dit que Lydia c'est beaucoup plus rapide. J'ai pas encore testé mais..."

    - persona_id: robert
      excerpt: >
        "J'ai réussi à ouvrir le compte mais j'ai mis 45 minutes.
        Ce qui m'a bloqué c'est qu'il y avait trop de choix d'enveloppes d'épargne dès le départ.
        Je ne savais pas quelle option choisir. J'ai appelé le support, ils ont été très patients.
        Si l'épargne automatique était simple et qu'on pouvait l'arrêter facilement, je l'activerais."

    - persona_id: compliance
      excerpt: >
        "L'épargne programmée implique un mandat SEPA de prélèvement récurrent.
        Réglementairement, cela nécessite : un contrat cadre MIF II, une information pré-contractuelle,
        un délai de rétractation de 14 jours, et la notification de chaque prélèvement 2 jours avant.
        Le dossier AMF doit être déposé avant toute commercialisation. Comptez 6 semaines de validation."

