id: case-finance
title: "Finio — Lancer l'épargne programmée malgré une faille UX critique"
difficulty: intermediate
estimated_duration: 120

context:
  company: Finio
  industry: Fintech — Application d'épargne personnelle
  role: Product Owner
  logo: "💰"
  summary: >
    Finio est une application d'épargne pour les 25-40 ans avec 180 000 utilisateurs actifs.
    L'équipe a découvert une faille UX critique dans le parcours d'onboarding qui fait chuter
    le taux d'activation de 52% à 31% depuis la dernière mise à jour.
    En parallèle, la direction veut lancer "l'épargne programmée" (prélèvements automatiques)
    avant fin Q2 pour attaquer un nouveau segment de marché. Vous devez arbitrer.
  business_goal: "Restaurer le taux d'activation à 50%+ ET lancer l'épargne programmée avant le 30 juin"
  constraints:
    - "Budget limité : pas de designer disponible avant 3 semaines"
    - "L'autorité de régulation AMF doit valider tout nouveau produit financier (+6 semaines)"
    - "Les utilisateurs existants ne peuvent pas voir leur expérience dégradée"
    - "L'équipe dev est composée de 4 personnes (2 front, 2 back)"

personas:
  - id: emma
    name: "Emma Thibaut"
    role: Jeune active, 28 ans
    avatar: "👩"
    personality: "Impatiente, mobile-first, compare plusieurs apps d'épargne"
    goals: "Épargner sans y penser, voir son argent fructifier"
    pain_points: "Trop d'étapes pour créer un premier virement, abandonne après 2 minutes"
    communication_style: "Usage impulsif, lit peu, fait confiance aux reviews App Store"
    quote: "J'ai essayé de créer un compte mais j'ai abandonné après l'étape 3. C'était trop long."

  - id: robert
    name: "Robert Dumont"
    role: Retraité, 63 ans
    avatar: "👴"
    personality: "Prudent, besoin de sécurité, appelle le support facilement"
    goals: "Placer son épargne de manière sécurisée, comprendre les frais"
    pain_points: "Interface trop complexe, peur de faire une erreur irréversible"
    communication_style: "Lit tout, pose beaucoup de questions, réfractaire aux changements"
    quote: "J'aimerais bien utiliser l'épargne automatique mais j'ai peur de ne pas comprendre comment l'arrêter."

  - id: compliance
    name: "Nathalie Perrin"
    role: Responsable Conformité AMF
    avatar: "⚖️"
    personality: "Rigoureuse, processus formels, aucune tolérance pour les raccourcis"
    goals: "Garantir la conformité de tous les produits financiers avec la réglementation AMF"
    pain_points: "Les équipes produit sous-estiment les délais réglementaires"
    communication_style: "Formelle, dossiers complets requis, timeline non-négociable"
    quote: "L'épargne programmée est un mandat de prélèvement SEPA. Dossier AMF complet requis. 6 semaines minimum."

  - id: cmo
    name: "Lucas Bernard"
    role: CMO (Directeur Marketing)
    avatar: "📣"
    personality: "Ambitieux, orienté croissance, sous pression des investisseurs"
    goals: "Lancer l'épargne programmée pour la campagne marketing de printemps"
    pain_points: "Les contraintes tech et conformité ralentissent toujours le go-to-market"
    communication_style: "Énergie haute, urgences fréquentes, focus acquisition"
    quote: "La campagne est bookée pour le 15 juin. Si l'épargne programmée n'est pas prête, on perd 200K€ de media achetée."

